# EmissionGate PR gate, step 2 of 2: publish (docs/GATE.md §5, THREAT_MODEL B5) — privileged.
# Runs when step 1 (emissiongate-gate.yml) completes. A workflow_run workflow always runs the
# definition on the default branch, so a pull request cannot change this file for its own run.
# It never checks out or runs pull-request code. It reads step 1's evaluation.json as untrusted
# data (size cap, strict schema, bound to the trusted head SHA below), re-derives the status with
# the default branch's policy, looks up any acknowledgement, updates the one sticky comment and sets
# the `EmissionGate / carbon` check run on the head commit. Make that check required.
name: emissiongate-publish

on:
  workflow_run:
    workflows: [emissiongate-gate]
    types: [completed]

permissions: {}                   # nothing by default

concurrency:
  group: emissiongate-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false       # publish every evaluation, in order

jobs:
  publish:
    # Only the evaluate workflow at its own path; a PR that edits it is refused in gate-publish.
    if: >-
      github.event.workflow_run.path == '.github/workflows/emissiongate-gate.yml' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_review') &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read               # download step 1's artefact
      checks: write               # the EmissionGate / carbon check run
      pull-requests: write        # the sticky comment; read the pull request and its reviews
      issues: read                # the eg/carbon-accepted label and who added it
      contents: read              # the default branch's .emissiongate/ policy
    steps:
      - name: Paths outside any checkout
        run: |
          echo "EG_RUNS_DIR=$RUNNER_TEMP/eg-publish" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evaluation"

      - name: Check out the default branch (trusted policy only; never the pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out EmissionGate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MohdJaved01/emissiongate
          ref: main
          path: engine
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install EmissionGate
        run: pip install -e engine

      - name: Download step 1's evaluation (untrusted data)
        continue-on-error: true   # a missing artefact fails the check closed in the next step
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: emissiongate-gate-*
          merge-multiple: true
          path: ${{ runner.temp }}/evaluation

      - name: Publish (comment and check run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          emissiongate gate-publish
          --evaluation "$RUNNER_TEMP/evaluation"
          --repo "$GITHUB_REPOSITORY"
          --head-sha "$HEAD_SHA"
          --base-branch "$DEFAULT_BRANCH"
          --config-repo trusted

      - name: Keep the publish ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emissiongate-publish-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/eg-publish/
          retention-days: 90
          if-no-files-found: ignore
