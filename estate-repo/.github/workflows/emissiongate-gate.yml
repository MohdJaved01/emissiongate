# EmissionGate PR gate, step 1 of 2: evaluate (docs/GATE.md §5, ADR-0015) — unprivileged.
# Deterministic, no LLM, and no token: this job plans the pull request's code, so it gets
# `contents: read` and nothing else, and never sees GITHUB_TOKEN. It writes evaluation.json as an
# artefact. Step 2 (emissiongate-publish.yml, a workflow_run workflow) reads that artefact as
# untrusted data, looks up any acknowledgement, comments, and sets the `EmissionGate / carbon` check.
# Works the same for fork pull requests. Make `EmissionGate / carbon` the required check, not this job.
#
# Trust layout (docs/THREAT_MODEL.md, B2): the pull request is checked out into estate/ and is the
# only untrusted input. The engine, its provider mirror, telemetry, policy and outputs all live
# outside estate/, and `--ci` refuses to run if any of them is configured inside it.
# Actions are pinned by full SHA (Dependabot proposes updates). Still to do before this is a
# production reference (ENTERPRISE_READINESS E1/E2): pin the engine to a release, restrict egress.
name: emissiongate-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["**/*.tf"]
  pull_request_review:            # an acknowledgement is a review on the head commit (THREAT_MODEL B4)
    types: [submitted, dismissed]

permissions: {}                   # nothing by default

concurrency:
  group: emissiongate-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read              # nothing else: no token reaches the planning process
    env:
      EG_COUNTRY_ISO: USA
    steps:
      - name: Trusted paths, all outside the pull request's checkout
        run: |
          echo "EG_DATA_DIR=$RUNNER_TEMP/eg-data" >> "$GITHUB_ENV"
          echo "EG_RUNS_DIR=$RUNNER_TEMP/eg-runs" >> "$GITHUB_ENV"
          echo "EG_TOFU_PLUGIN_DIR=$GITHUB_WORKSPACE/engine/.tofu-providers" >> "$GITHUB_ENV"

      - name: Check out the pull request (untrusted; base and head SHAs are needed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: estate
          fetch-depth: 0
          persist-credentials: false   # untrusted PR HCL must not find a token in .git/config

      - name: Check out EmissionGate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MohdJaved01/emissiongate
          ref: main
          path: engine
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false

      - name: Restore the vetted provider mirror
        id: mirror
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: engine/.tofu-providers
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('engine/tofu/versions.tf') }}

      - name: Mirror providers (cache miss only; the only networked tofu step, ADR-0014)
        if: steps.mirror.outputs.cache-hit != 'true'
        working-directory: engine/tofu
        run: tofu providers mirror "$EG_TOFU_PLUGIN_DIR"

      - name: Install EmissionGate
        run: pip install -e engine

      - name: Synthetic telemetry for observed utilisation (outside the checkout)
        run: emissiongate estate --telemetry-only --seed 42 --out "$EG_DATA_DIR"

      - name: Evaluate (plans base and head; no token, never posts)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          emissiongate gate --ci --config-from-base
          --estate-dir estate
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Keep the evaluation, prediction and ledger (read by step 2; calibration, GATE §7)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emissiongate-gate-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/eg-runs/
          retention-days: 90
          if-no-files-found: ignore
