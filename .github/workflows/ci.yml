name: ci

on:
  push:
  pull_request:

# Read-only token for every job unless a job asks for more (ENTERPRISE_READINESS E7).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false
      - name: Install
        run: make setup
      - name: Agent files consistent (AGENTS.md, .codex, .agents, .claude)
        run: make agent-check
      - name: Mirror OpenTofu providers (the only networked step)
        run: make providers
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Offline demo (no LLM, no GitHub token)
        run: make demo-offline score
      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-run
          path: runs/
          if-no-files-found: ignore
