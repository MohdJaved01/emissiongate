# Optional: an extra invariant review by Codex on pull requests to this repo.
# Opt-in per PR by adding the label "codex-review". Needs an OPENAI_API_KEY repository secret.
# Without an API key, use the Codex GitHub app instead: comment "@codex review" on the PR; it reads the
# "## Code Review Rules" section of the nearest AGENTS.md.
name: codex-invariant-review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'codex-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Run Codex (read-only)
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/invariant-review.md

  comment:
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          BODY: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.BODY,
            });
