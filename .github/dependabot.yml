# Update proposals for review by a human (ENTERPRISE_READINESS E7). No auto-merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /estate-repo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
